<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How aeon classify assigns a taxonomy</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #283a4c;
      --color-muted:   #4b5b6b;
      --color-accent:  #2f7a70;
      --font-sans:     'Archivo', system-ui, sans-serif;
      --font-display:  'Archivo', system-ui, sans-serif;
      --font-mono:     'IBM Plex Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }


    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }

    .subtitle { font-size: 1rem; color: var(--color-muted); margin-bottom: 1.75rem; }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>How aeon classify assigns a taxonomy</h1>
    <p class="subtitle">Each genome stops at the first step that makes a call.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aeon-classify-cascade-title aeon-classify-cascade-desc">
        <title id="aeon-classify-cascade-title">How aeon classify assigns a taxonomy</title>
        <desc id="aeon-classify-cascade-desc">Flowchart of the aeon classify cascade: a genome sketch search and TurboANI assign species, DIAMOND AAI against the ten closest proteomes assigns genus or family, and a marker gene search assigns order; each decision either makes the call or passes the genome to the next step.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5b6b"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- Zones -->
        <rect x="32" y="24" width="1216" height="176" rx="8" fill="#f2f8f7" stroke="#d3e8e3" stroke-width="1"/>
        <text x="48" y="44" fill="#2f7a70" font-size="11" font-weight="700" font-family="'Archivo', sans-serif" >Step 1<tspan fill="#4b5b6b" font-weight="500" dx="8">nt index</tspan></text>
        <rect x="32" y="224" width="1216" height="204" rx="8" fill="#f2f8f7" stroke="#d3e8e3" stroke-width="1"/>
        <text x="48" y="244" fill="#2f7a70" font-size="11" font-weight="700" font-family="'Archivo', sans-serif" >Step 2<tspan fill="#4b5b6b" font-weight="500" dx="8">aa index</tspan></text>
        <rect x="32" y="452" width="1216" height="224" rx="8" fill="#f2f8f7" stroke="#d3e8e3" stroke-width="1"/>
        <text x="48" y="472" fill="#2f7a70" font-size="11" font-weight="700" font-family="'Archivo', sans-serif" >Step 3<tspan fill="#4b5b6b" font-weight="500" dx="8">markers index</tspan></text>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Step 1 -->
        <line x1="172" y1="128" x2="216" y2="128" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="356" y1="128" x2="400" y2="128" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="608" y1="128" x2="652" y2="128" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="792" y1="128" x2="836" y2="128" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1044" y1="128" x2="1096" y2="128" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 504 76 L 504 64 Q 504 56 512 56 L 1152 56 Q 1160 56 1160 64 L 1160 104" fill="none" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 1 → Step 2 -->
        <path d="M 940 180 L 940 204 Q 940 212 932 212 L 188 212 Q 180 212 180 220 L 180 330" fill="none" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 2 -->
        <line x1="192" y1="356" x2="232" y2="356" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="372" y1="356" x2="412" y2="356" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="552" y1="356" x2="592" y2="356" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="800" y1="356" x2="840" y2="356" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1048" y1="356" x2="1096" y2="356" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 696 304 L 696 288 Q 696 280 704 280 L 1096 280" fill="none" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 2 → Step 3 -->
        <path d="M 944 408 L 944 432 Q 944 440 936 440 L 188 440 Q 180 440 180 448 L 180 514" fill="none" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step 3 -->
        <line x1="192" y1="540" x2="240" y2="540" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="448" y1="540" x2="496" y2="540" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="636" y1="540" x2="684" y2="540" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="892" y1="540" x2="1096" y2="540" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 344 592 L 344 624 Q 344 632 352 632 L 784 632" fill="none" stroke="#4b5b6b" stroke-width="1.2"/>
        <line x1="788" y1="592" x2="788" y2="628" stroke="#4b5b6b" stroke-width="1.2"/>
        <line x1="792" y1="632" x2="1096" y2="632" stroke="#4b5b6b" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="816" y="38" width="28" height="12" rx="2" fill="#f2f8f7"/>
        <text x="830" y="47" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">YES</text>
        <rect x="618" y="110" width="24" height="12" rx="2" fill="#f2f8f7"/>
        <text x="630" y="119" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">NO</text>
        <rect x="1056" y="110" width="28" height="12" rx="2" fill="#f2f8f7"/>
        <text x="1070" y="119" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">YES</text>
        <rect x="948" y="186" width="24" height="12" rx="2" fill="#f2f8f7"/>
        <text x="960" y="195" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">NO</text>

        <rect x="986" y="262" width="28" height="12" rx="2" fill="#f2f8f7"/>
        <text x="1000" y="271" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">YES</text>
        <rect x="808" y="338" width="24" height="12" rx="2" fill="#f2f8f7"/>
        <text x="820" y="347" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">NO</text>
        <rect x="1058" y="338" width="28" height="12" rx="2" fill="#f2f8f7"/>
        <text x="1072" y="347" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">YES</text>
        <rect x="952" y="412" width="24" height="12" rx="2" fill="#f2f8f7"/>
        <text x="964" y="421" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">NO</text>

        <rect x="458" y="522" width="28" height="12" rx="2" fill="#f2f8f7"/>
        <text x="472" y="531" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">YES</text>
        <rect x="980" y="522" width="28" height="12" rx="2" fill="#f2f8f7"/>
        <text x="994" y="531" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">YES</text>
        <rect x="352" y="600" width="24" height="12" rx="2" fill="#f2f8f7"/>
        <text x="364" y="609" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">NO</text>
        <rect x="796" y="600" width="24" height="12" rx="2" fill="#f2f8f7"/>
        <text x="808" y="609" fill="#4b5b6b" font-size="8.5" font-weight="500" font-family="'IBM Plex Mono', monospace" text-anchor="middle">NO</text>

        <!-- Step 1 nodes -->
        <rect x="52" y="104" width="120" height="48" rx="24" fill="#ffffff" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="112" y="126" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Query genome</text>
        <text x="112" y="140" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">FASTA</text>

        <rect x="216" y="102" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="286" y="126" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">nt sketch search</text>
        <text x="286" y="140" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">k=16, s=15k, top 10</text>

        <polygon points="504,76 608,128 504,180 400,128" fill="#e3eef8" stroke="#6b97c6" stroke-width="1.4"/>
        <text x="504" y="126" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Only one hit ≥ 90%</text>
        <text x="504" y="140" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">and ≥ radius + 1?</text>

        <rect x="652" y="102" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="722" y="126" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">TurboANI</text>
        <text x="722" y="140" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ANI + AF, hits ≥ 90%</text>

        <polygon points="940,76 1044,128 940,180 836,128" fill="#e3eef8" stroke="#6b97c6" stroke-width="1.4"/>
        <text x="940" y="126" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Best AF ≥ 0.5 hit</text>
        <text x="940" y="140" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">within its radius?</text>

        <rect x="1096" y="104" width="128" height="48" rx="24" fill="#283a4c" stroke="none"/>
        <text x="1160" y="126" fill="#ffffff" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Species</text>
        <text x="1160" y="140" fill="#93d5c0" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">ANI screen</text>

        <!-- Step 2 nodes -->
        <rect x="52" y="330" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="122" y="354" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">FragGeneScanRs</text>
        <text x="122" y="368" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">gene calls</text>

        <rect x="232" y="330" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="302" y="354" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">aa sketch search</text>
        <text x="302" y="368" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">k=7, s=10k, top 10</text>

        <rect x="412" y="330" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="482" y="354" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">DIAMOND AAI</text>
        <text x="482" y="368" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">10 refs, ≥ 50 RBH</text>

        <polygon points="696,304 800,356 696,408 592,356" fill="#e3eef8" stroke="#6b97c6" stroke-width="1.4"/>
        <text x="696" y="354" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">≥ 65% AAI and 5 pts</text>
        <text x="696" y="368" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">over other genera?</text>

        <polygon points="944,304 1048,356 944,408 840,356" fill="#e3eef8" stroke="#6b97c6" stroke-width="1.4"/>
        <text x="944" y="354" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">≥ 45% AAI and 5 pts</text>
        <text x="944" y="368" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">over other families?</text>

        <rect x="1096" y="256" width="128" height="48" rx="24" fill="#283a4c" stroke="none"/>
        <text x="1160" y="278" fill="#ffffff" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Genus</text>
        <text x="1160" y="292" fill="#93d5c0" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">defined by AAI</text>

        <rect x="1096" y="332" width="128" height="48" rx="24" fill="#283a4c" stroke="none"/>
        <text x="1160" y="354" fill="#ffffff" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Family</text>
        <text x="1160" y="368" fill="#93d5c0" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">defined by AAI</text>

        <!-- Step 3 nodes -->
        <rect x="52" y="514" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="122" y="538" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Extract markers</text>
        <text x="122" y="552" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">hmmsearch + hmmalign</text>

        <polygon points="344,488 448,540 344,592 240,540" fill="#e3eef8" stroke="#6b97c6" stroke-width="1.4"/>
        <text x="344" y="538" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Markers in ≥ 10%</text>
        <text x="344" y="552" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">of MSA columns?</text>

        <rect x="496" y="514" width="140" height="52" rx="6" fill="#dcefeb" stroke="#5ea69c" stroke-width="1.4"/>
        <text x="566" y="538" fill="#283a4c" font-size="12" font-weight="600" font-family="'Archivo', sans-serif" text-anchor="middle">Marker search</text>
        <text x="566" y="552" fill="#4b5b6b" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">k=5, s=3k, top 10</text>

        <polygon points="788,488 892,540 788,592 684,540" fill="#e3eef8" stroke="#6b97c6" stroke-width="1.4"/>

        <rect x="1096" y="608" width="128" height="48" rx="24" fill="#283a4c" stroke="none"/>

        <text x="64" y="734" fill="#4b5b6b" font-size="10" font-family="'Archivo', sans-serif">Taxonomic call</text>

  </div>
</body>
</html>
