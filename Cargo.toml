[package]
name = "rust-aeon"
version = "0.4.5"
edition = "2024"
authors = ["Jianshu Zhao <jianshuzhao@yahoo.com>"]
repository = "https://github.com/jianshu93/aeon"
description = "Efficient and robust genome similarity search with evolving disk-based proximity graphs"
license = "MIT"
keywords = ["proxmity-grah", "minhash", "similarity", "diskann", "vamana", "lsh"]


[[bin]]

name = "aeon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
needletail = "0.6"
num = "0.4"
num_cpus = "1.16"
num-traits = "0.2.19"
# kmerutils = { version = "0.0.14", features = ["stdsimd"]}
kmerutils = { git = "https://github.com/jianshu93/kmerutils", features = ["stdsimd"] }
anndists = { version = "0.1.4", features = ["stdsimd"] }
# anndists = { git = "https://github.com/jianshu93/anndists", features = ["stdsimd"] }
xxhash-rust = { version = "0.8", features = [ "std", "xxh3" ] }
rust-diskann = { git = "https://github.com/jianshu93/rust-diskann" }
# rust-diskann = { git = "https://github.com/jianshu93/rust-diskann", rev = "1450b51c0094ddfe0b0af5afada266ad53a07aa8" }
turboani = "=0.1.8"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
